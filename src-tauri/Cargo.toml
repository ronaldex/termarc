[package]
name = "termarc"
version = "0.1.0"
description = "Termarc is a fast, native desktop terminal workspace."
authors = ["you"]
edition = "2024"
default-run = "termarc"

[lib]
name = "termarc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
# block 0.1.6 declares an uninhabited extern static, which newer Rust warns
# will become a hard error. Keep the Cocoa stack on a locally patched copy.
block = { path = "patches/block" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
mac-notification-sys = "0.6.15"
objc = "0.2.7"
